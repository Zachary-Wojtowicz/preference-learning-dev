  .pred-block{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:1rem 1.1rem}
  .pred-block-header{font-size:.92rem;font-weight:500;margin-bottom:.85rem;color:#1a1a1a;line-height:1.45}
  .pred-block-header strong{font-weight:600;color:#3b82f6}
  .pred-block-rating{margin-top:.5rem}
  .pred-block-rating .likert-prompt-inline{text-align:center;font-size:.82rem;color:#444;margin-bottom:.5rem;font-weight:500}

<body>
<div class="container" id="app"><div class="loading">Loading…</div></div>
<script>
(function(){
if(window.parent!==window){
  // Embedded mode: blend into parent (Qualtrics) bg and resize iframe to content.
  var setEmbedStyle=function(){
    document.documentElement.style.background='transparent';
    if(document.body){document.body.style.background='transparent';document.body.style.padding='1rem';}
  };
  setEmbedStyle();
  document.addEventListener('DOMContentLoaded',setEmbedStyle);
  var lastH=0;
  window.__sendExperimentSize=function(){
    var h=Math.max(document.documentElement.scrollHeight,document.body?document.body.scrollHeight:0);
    if(h&&h!==lastH){lastH=h;try{window.parent.postMessage({type:'experiment_resize',height:h},'*');}catch(e){}}
  };
  var schedule=function(){requestAnimationFrame(window.__sendExperimentSize);};
  window.addEventListener('load',schedule);
  window.addEventListener('resize',schedule);
  if(window.ResizeObserver){
    var ro=new ResizeObserver(schedule);
    if(document.body)ro.observe(document.body);
    else document.addEventListener('DOMContentLoaded',function(){ro.observe(document.body);});
  }
  // Tell the parent to scroll its window so the iframe top is in view (called on screen change).
  window.__scrollParentToTop=function(){
    try{window.parent.postMessage({type:'experiment_scroll_top'},'*');}catch(e){}
  };
}else{
  window.__scrollParentToTop=function(){};
}
var app=document.getElementById('app');
var trials=[],experimentConfig=null,gramMatrix=null,condition=null,conditionKey='',participantId='',domainKey='';
var assignedTrialIndices=[],currentStep=0,responses=[],chosen=null,startTime=null,firstChoiceTime=null,topKSliders=3,visibleSliderIndices=[],postUrl=null;
var trainingPlan=[],trainingStep=0,inTraining=false,trainingResponses=[],numFeedback=20,numTraining=5;
var dimQuantiles=null;
var dimMidpoints=null;  // {dimension_id -> [b1, b2, ..., b_{n-1}]} per-dim quantile boundaries
var deltaGram=null,deltaGramN=0,trialProjections=null,evalState=null;
var optionProjections=null,predictionState=null;
var optionGram=null,optionGramN=0,optionIdToIdx=null;
var HIDDEN_FIELDS=new Set(['title','_rendered_text','movie_id','wine_id','action_id','completion_id','option_id','id','row_id','text','prompt_hash','category','embedding','rating_count','taster_twitter_handle','points','price','taster_name','dilemma_id','topic_group','situation','values','consequence']);
var FIELD_LABELS={plot_summary:'Plot',genres:'Genres',director:'Director',stars:'Stars',variety:'Variety',country:'Country',province:'Province',points:'Rating',price:'Price',description:'Description',user_prompt:'Question',assistant_response:'Response',winery:'Winery',designation:'Designation',region_1:'Region',taster_name:'Reviewer'};
var DEFAULT_CATEGORIES=[
  {key:'skip',phrase:'prefer to skip',label:'Prefer to skip',mult:-1.5},
  {key:'not_into',phrase:"aren\u2019t into",label:"Aren\u2019t into",mult:-1.0},
  {key:'indifferent',phrase:'are indifferent to',label:'Indifferent',mult:0.0},
  {key:'like',phrase:'like',label:'Like',mult:1.0},
  {key:'love',phrase:'love',label:'Love',mult:1.5}
];
var CATEGORIES=DEFAULT_CATEGORIES;
function loadCategories(){
  if(experimentConfig&&experimentConfig.inference_categories&&experimentConfig.inference_categories.length>0)
    CATEGORIES=experimentConfig.inference_categories;
  else CATEGORIES=DEFAULT_CATEGORIES;
}
// Compute quantile boundaries for category assignment from the symmetric
// distribution {value_if_a, value_if_b} over the trial pool. With n CATEGORIES
// we return n-1 boundaries; effective values below boundary[i] get CATEGORIES[i],
// values above all boundaries get the last category. Symmetric construction
// guarantees q_i = -q_{n-1-i}, so v=0 always lands in the middle bucket.
//
// Two modes (set via experimentConfig.categorization):
//   "perdim" (default) — one set of boundaries per dimension. Each dim's
//      category masses are 20% each by construction.
//   "pooled" — one shared set of boundaries computed from ALL (p,k) values.
//      Categories have the same yardstick across dims; per-dim mass varies.
//
// Both modes return {dimension_id -> boundaries} so the lookup in catFromEff
// is identical; "pooled" just stores the same array under every dim_id.
function computeDimQuantiles(){
  if(!trials||trials.length===0)return null;
  var nCats=CATEGORIES.length;
  if(nCats<2)return null;
  var mode=(experimentConfig&&experimentConfig.categorization)||'perdim';
  function quantilesOf(arr){
    if(arr.length<nCats)return null;
    arr.sort(function(a,b){return a-b;});
    var q=function(p){var i=Math.floor(p*(arr.length-1));return arr[i];};
    var qs=[];for(var i=1;i<nCats;i++)qs.push(q(i/nCats));
    return (qs[0]===qs[qs.length-1])?null:qs;
  }
  var byDim={},dimIds=[];
  trials.forEach(function(t){
    if(!t.sliders)return;
    t.sliders.forEach(function(s){
      var did=s.dimension_id;if(did==null)return;
      if(!byDim[did]){byDim[did]=[];dimIds.push(did);}
      var va=Number(s.value_if_a),vb=Number(s.value_if_b);
      if(Number.isFinite(va))byDim[did].push(va);
      if(Number.isFinite(vb))byDim[did].push(vb);
    });
  });
  if(mode==='pooled'){
    var pooled=[];dimIds.forEach(function(d){pooled.push.apply(pooled,byDim[d]);});
    var qs=quantilesOf(pooled.slice());
    var out={};dimIds.forEach(function(d){out[d]=qs;});
    return out;
  }
  // perdim (default)
  var out={};
  dimIds.forEach(function(did){out[did]=quantilesOf(byDim[did].slice());});
  return out;
}
function catFromEff(v,dimensionId){
  // Per-dim quantile assignment when boundaries available.
  if(dimQuantiles&&dimensionId!=null&&dimQuantiles[dimensionId]){
    var qs=dimQuantiles[dimensionId];
    for(var i=0;i<qs.length;i++)if(v<qs[i])return CATEGORIES[i].key;
    return CATEGORIES[CATEGORIES.length-1].key;
  }
  // Fallback: fixed multiplier-based assignment (used for movies/wines until
  // their pools are loaded, or when a dim's distribution is degenerate).
  var maxM=Math.max.apply(null,CATEGORIES.map(function(c){return Math.abs(c.mult)}))||1;
  var target=(v/100)*maxM,best=CATEGORIES[Math.floor(CATEGORIES.length/2)].key,bestD=Infinity;
  CATEGORIES.forEach(function(c){var d=Math.abs(c.mult-target);if(d<bestD){bestD=d;best=c.key;}});
  return best;
}
function catPhrase(k){var c=CATEGORIES.find(function(x){return x.key===k});return c?c.phrase:k;}
function catMult(k){var c=CATEGORIES.find(function(x){return x.key===k});return c?c.mult:0;}
// Look up the full dimension definition (name, low/high labels, scoring guidance)
// from experimentConfig.dimensions. Accepts either the string id ("dim_1") or
// the numeric dimension_id (1).
function getDimDef(idOrDimId){
  if(!experimentConfig||!Array.isArray(experimentConfig.dimensions))return null;
  for(var i=0;i<experimentConfig.dimensions.length;i++){
    var d=experimentConfig.dimensions[i];
    if(d.id===idOrDimId||d.dimension_id===idOrDimId)return d;
  }
  return null;
}
// Build the small ‘i’ info icon + hover tooltip showing the dim definition.
// Returns '' if the dim has no associated definition (so renders cleanly).
function dimTooltipHtml(dim){
  if(!dim)return '';
  var hasPoles=dim.low_label||dim.high_label;

// ===== Newton+L2 fitter for post-experiment evaluation =====
// Unified BTL fit with optional Gaussian prior on beta.
//   min_beta  -LL(U beta, y) + (lam/2)||beta||^2 + (mu/2)||beta - betaPrior||^2
// Use mu=0, betaPrior=null for plain L2 (projection_only / random_projection).
// Use mu>0, betaPrior!=null for feedback-as-prior (projection_alpha).
// Penalty is P=I (uniform regularization), matching the Python pipeline.
function _matVec(M,v){var n=M.length,r=new Array(n);for(var i=0;i<n;i++){var row=M[i],s=0;for(var j=0;j<v.length;j++)s+=row[j]*v[j];r[i]=s;}return r;}
function _matVec2(M,v){var n=M.length,r=new Array(n);for(var i=0;i<n;i++){var s=0;for(var j=0;j<v.length;j++)s+=M[i][j]*v[j];r[i]=s;}return r;}
function _solveLinear(A,b){
  var n=b.length,M=[],rhs=b.slice();
  for(var i=0;i<n;i++)M.push(A[i].slice());
  for(var k=0;k<n;k++){
    var maxR=k,maxV=Math.abs(M[k][k]);
    for(var i=k+1;i<n;i++)if(Math.abs(M[i][k])>maxV){maxV=Math.abs(M[i][k]);maxR=i;}
    if(maxR!==k){var tmp=M[k];M[k]=M[maxR];M[maxR]=tmp;var t=rhs[k];rhs[k]=rhs[maxR];rhs[maxR]=t;}
    if(Math.abs(M[k][k])<1e-12)return null;
    for(var i2=k+1;i2<n;i2++){var f=M[i2][k]/M[k][k];for(var j=k;j<n;j++)M[i2][j]-=f*M[k][j];rhs[i2]-=f*rhs[k];}
  }
  var x=new Array(n);
  for(var i=n-1;i>=0;i--){var s=rhs[i];for(var j=i+1;j<n;j++)s-=M[i][j]*x[j];x[i]=s/M[i][i];}
  return x;
}
function _sigm(x){if(x>20)return 1-1e-9;if(x<-20)return 1e-9;return 1/(1+Math.exp(-x));}

// Unified BTL fit. Returns beta (K-vector).
//   U: T x K design matrix
//   y: T-vector of {0,1} labels (1 = chose option a)
//   lam: L2 penalty
//   betaPrior: K-vector or null (no prior)
//   muPrior: prior strength (mu_prior in the Python code)
//   maxIter: max Newton iterations (default 15)
function fitBTL(U,y,lam,betaPrior,muPrior,maxIter){
  var T=U.length;if(T===0)return [];
  var K=U[0].length,beta=new Array(K).fill(0);
  var bp=betaPrior||new Array(K).fill(0);
  var mu=muPrior||0.0;
  for(var iter=0;iter<(maxIter||15);iter++){
    var u=_matVec2(U,beta);
    var p=u.map(_sigm),w=p.map(function(pi){return pi*(1-pi);});
    // Gradient: U^T (p - y) + lam*beta + mu*(beta - betaPrior)
    var grad=new Array(K).fill(0);
    for(var k=0;k<K;k++){
      var s=0;for(var t=0;t<T;t++)s+=U[t][k]*(p[t]-y[t]);
      grad[k]=s+lam*beta[k]+mu*(beta[k]-bp[k]);
    }
    // Hessian: U^T W U + (lam + mu) * I
    var H=[];
    for(var k2=0;k2<K;k2++){
      var row=new Array(K).fill(0);
      for(var k3=0;k3<K;k3++){
        var s3=0;for(var t3=0;t3<T;t3++)s3+=U[t3][k2]*w[t3]*U[t3][k3];
        row[k3]=s3+(k2===k3?(lam+mu):0);
      }
      H.push(row);
    }
    var rhs=grad.map(function(g){return -g;});
    var dB=_solveLinear(H,rhs);if(!dB)break;
    var step=0;
    for(var k4=0;k4<K;k4++){beta[k4]+=dB[k4];if(Math.abs(dB[k4])>step)step=Math.abs(dB[k4]);}
    if(step<1e-7)break;
  }
  return beta;
}

// Rescale a feedback-derived prior to match the data-only fit's β magnitude.
// Without this, betaPrior lives on raw_projection (delta) scale (~0.1) while
// β lives on BTL-logit scale (~10), and mu_prior=2 effectively shrinks β to
// ~0. After rescaling, the prior is a unit vector in β-space pointing in the
// feedback direction, with magnitude inherited from the data fit. Then
// mu_prior parameterizes "trust in feedback direction" cleanly.
// See experiments/dilemmas/diagnose_scale.py for the diagnostic.
function rescalePriorToBetaScale(bpRaw,betaData){
  if(!Array.isArray(bpRaw)||!Array.isArray(betaData))return bpRaw;
  var rawSq=0;for(var i=0;i<bpRaw.length;i++)rawSq+=bpRaw[i]*bpRaw[i];
  var rawNorm=Math.sqrt(rawSq);
  if(rawNorm<1e-12)return bpRaw.slice();
  var dataSq=0;for(var j=0;j<betaData.length;j++)dataSq+=betaData[j]*betaData[j];
  var s=Math.sqrt(dataSq)/rawNorm;
  return bpRaw.map(function(v){return s*v;});
}
// Compute per-dim bin midpoints from raw_projection values in trialProjections.
// These are delta-level projections (same scale as U_tk), NOT the slider values.
// Returns {dimension_id: [m0, m1, ..., m_{nCats-1}]} for each dimension.
function computeDimMidpoints(){
  if(!trialProjections||!experimentConfig||!experimentConfig.dimensions)return null;
  var nCats=CATEGORIES.length;if(nCats<2)return null;
  var dims=experimentConfig.dimensions,K=dims.length;
  // Collect all raw_projection values per dimension across all trials
  var byDim=new Array(K);
  for(var k=0;k<K;k++)byDim[k]=[];
  for(var pi=0;pi<trialProjections.length;pi++){
    var tp=trialProjections[pi];
    if(!tp||!Array.isArray(tp.raw_projection))continue;
    for(var k2=0;k2<K&&k2<tp.raw_projection.length;k2++){
      var v=tp.raw_projection[k2];
      if(Number.isFinite(v)){byDim[k2].push(v);byDim[k2].push(-v);}
    }
  }
  var out={};
  for(var k3=0;k3<K;k3++){
    var did=dims[k3].id||('dim_'+dims[k3].dimension_id);
    var arr=byDim[k3].slice().sort(function(a,b){return a-b;});
    if(arr.length<nCats){out[did]=null;continue;}
    var mids=[];
    for(var i=0;i<nCats;i++){
      var q=(2*i+1)/(2*nCats);
      var idx=Math.min(Math.floor(q*(arr.length-1)),arr.length-1);
      mids.push(arr[idx]);
    }
    out[did]=mids;
  }
  return out;
}
var dimMidpoints=null;

// Build participant-trial-indexed data structures from responses.
// Returns:
//   U      (T x K): LLM projection of each trial's delta
//   U_rand (T x K): random projection of each trial's delta (precomputed)
//   y      (T):     1 if chose option a, 0 if b
//   betaPrior (K):  per-dim mean of feedback values (see below)
//   hasPrior (bool): whether any beta_prior values are nonzero
//
// Feedback storage semantics (matching the Python pipeline):
//   action='affirm'/'moderate' -> store U[t][idx] (raw delta projection)
//   action='remove'            -> store 0.0
//   action='modify'            -> store midpoint(category)
//   action='none' (categories) -> store midpoint(confirmed default category)
// Then beta_prior[k] = mean of stored values for dim k across visible trials.
function buildEvalInputs(){
  if(!trialProjections||!Array.isArray(trialProjections))return null;
  if(!experimentConfig||!Array.isArray(experimentConfig.dimensions))return null;
  var T=responses.length;if(T===0)return null;
  var dims=experimentConfig.dimensions,K=dims.length;
  var dimIds=dims.map(function(d){return d.id||('dim_'+d.dimension_id);});

  // U: LLM projection of each trial's delta (T x K)
  var U=[],y=[],poolIdx=[];
  for(var i=0;i<T;i++){
    var pi=assignedTrialIndices[i];poolIdx.push(pi);
    var tp=trialProjections[pi];
    if(!tp||!Array.isArray(tp.raw_projection))return null;
    U.push(tp.raw_projection.slice());
    y.push(responses[i].chosen==='a'?1:0);
  }

  // U_rand: random projection of each trial's delta (T x K).
  // Precomputed by select_top_dims.py and stored in trial_projections.json.
  var U_rand=null;
  var allHaveRand=true;
  for(var i2=0;i2<T;i2++){
    var tp2=trialProjections[poolIdx[i2]];
    if(!tp2||!Array.isArray(tp2.random_projection)||tp2.random_projection.length!==K){
      allHaveRand=false;break;
    }
  }
  if(allHaveRand){
    U_rand=[];
    for(var i3=0;i3<T;i3++){
      U_rand.push(trialProjections[poolIdx[i3]].random_projection.slice());
    }
  }

  // Compute beta_prior from feedback (one value per visible dim per trial).
  if(!dimMidpoints) dimMidpoints=computeDimMidpoints();
  var sums=new Array(K).fill(0),counts=new Array(K).fill(0);
  responses.forEach(function(r,t){
    if(!r.inference_values)return;
    Object.keys(r.inference_values).forEach(function(did){
      var idx=dimIds.indexOf(did);if(idx<0)return;
      var info=r.inference_values[did];
      var action=info.action||'none';
      var value=null;
      if(action==='remove'){
        value=0.0;  // dimension is irrelevant
      }else{
        // affirm / moderate / modify / none — all contribute the midpoint of
        // the (current or unchanged) category. For affirm/moderate/none the
        // category equals the algorithm's pre-selected default; for modify
        // it's the user's chosen replacement. Storing the category midpoint
        // (rather than U[t,k]) keeps the prior at a stable, calibrated
        // magnitude regardless of which trial it came from.
        var cat=info.category;
        var catIdx=-1;
        for(var ci=0;ci<CATEGORIES.length;ci++){
          if(CATEGORIES[ci].key===cat){catIdx=ci;break;}
        }
        if(catIdx>=0&&dimMidpoints&&dimMidpoints[did]&&dimMidpoints[did][catIdx]!=null){
          value=dimMidpoints[did][catIdx];
        }
      }
      if(value!==null&&isFinite(value)){
        sums[idx]+=value;
        counts[idx]+=1;
      }
    });
  });
  var betaPrior=new Array(K).fill(0);
  var hasPrior=false;
  for(var k=0;k<K;k++){
    if(counts[k]>0){
      betaPrior[k]=sums[k]/counts[k];
      if(betaPrior[k]!==0)hasPrior=true;
    }
  }

  return {U:U,U_rand:U_rand,y:y,K:K,T:T,dims:dims,dimIds:dimIds,
          betaPrior:betaPrior,hasPrior:hasPrior};
}

// Top-N most-positive and N most-negative dimensions for the bar-chart variant.
function buildTopBottom(scores,dims,nEach){
  var arr=scores.map(function(s,i){return{i:i,s:s,name:dims[i].name||dims[i].label||('Dimension '+(i+1)),id:dims[i].id||('dim_'+dims[i].dimension_id)};}).sort(function(a,b){return b.s-a.s;});
  var most=arr.slice(0,nEach);
  // Tail of arr is the most-negative end, sorted descending — natural reading order
  // (smallest negative magnitude first, largest negative magnitude last) is just the slice.
  var least=arr.slice(-nEach);
  return {most:most,least:least};
}
// Map signed scores to top-N inferences with quintile categories within those N.
function buildInferences(scores,dims,nShow){
  var idxs=scores.map(function(s,i){return{i:i,abs:Math.abs(s),s:s};}).sort(function(a,b){return b.abs-a.abs;}).slice(0,nShow);
  // Order by signed score (most positive first) to assign quintile categories
  var ordered=idxs.slice().sort(function(a,b){return b.s-a.s;});
  var nCats=CATEGORIES.length,n=ordered.length;
  // Bin into quintiles by signed rank: most positive -> CATEGORIES[nCats-1] ('love'); most negative -> CATEGORIES[0] ('skip')
  var perBin=Math.ceil(n/nCats);
  var dimToCat={};
  ordered.forEach(function(item,rank){
    var binFromTop=Math.floor(rank/perBin);
    var catIdx=nCats-1-Math.min(binFromTop,nCats-1);
    dimToCat[item.i]=CATEGORIES[catIdx].key;
  });
  // Final list in signed-score order (top to bottom: love -> skip)
  return ordered.map(function(item){
    var d=dims[item.i],catKey=dimToCat[item.i];
    var cat=CATEGORIES.find(function(c){return c.key===catKey;})||CATEGORIES[Math.floor(nCats/2)];
    return {
      dim_id: d.id||('dim_'+d.dimension_id),
      dim_name: d.name||d.label||('Dimension '+(item.i+1)),
      category: cat.key,
      category_label: cat.label,
      phrase: cat.phrase,
      score: item.s,
    };
  });
}

function makeRandomScores(K,seedSalt){
  // Fallback random scores when precomputed random projections are unavailable.
  // Used only as a degraded path; the primary mechanism is U_rand from
  // trial_projections.json (precomputed by select_top_dims.py).
  var rng=seedRandom(hashStr(participantId+(seedSalt||'_random')));
  var s=new Array(K);
  for(var k=0;k<K;k++){
    var u1=Math.max(rng(),1e-9),u2=rng();
    s[k]=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);
  }
  return s;
}
function startEvaluation(){
  var comp=experimentConfig&&experimentConfig.comparison;
  var allowed=comp&&Array.isArray(comp.show_for_conditions)?comp.show_for_conditions:null;
  var isChoiceOnly=(conditionKey==='choice_only');
  // choice_only is shown even though it's not in show_for_conditions — it gets random vs LLM proj.
  if(allowed&&allowed.indexOf(conditionKey)<0&&!isChoiceOnly){evalState={skipped:'condition_excluded'};proceedAfterEval();return;}
  var inputs=buildEvalInputs();
  if(!inputs){evalState={skipped:'no_eval_data'};proceedAfterEval();return;}

  var lamP=(comp&&typeof comp.lambda_partial==='number')?comp.lambda_partial:0.01;
  var muPrior=(comp&&typeof comp.feedback_alpha==='number')?comp.feedback_alpha:2.0;
  var nShow=(comp&&comp.n_dimensions_shown)||10;
  var format=(comp&&comp.eval_format)||'inference_list';

  var t0=performance.now();
  // Always fit projection_only (for both conditions and as fallback).
  var betaProj=fitBTL(inputs.U,inputs.y,lamP,null,0,15);
  var betaRand=null,betaAlpha=null;
  if(isChoiceOnly){
    if(inputs.U_rand){
      betaRand=fitBTL(inputs.U_rand,inputs.y,lamP,null,0,15);
    }else{
      // Fallback: synthesize random scores directly. Skip evaluation rather
      // than show a misleading comparison.
      evalState={skipped:'missing_random_projections'};proceedAfterEval();return;
    }
  }else{
    if(inputs.hasPrior){
      // Rescale the feedback-derived prior to match betaProj's magnitude
      // before fitting. Without this, the prior lives on raw_projection scale
      // (~0.1) while β lives on BTL-logit scale (~10), so muPrior acts as
      // near-zero shrinkage. After rescaling, the prior is a unit vector in
      // β-space pointing in the feedback direction.
      var bpRescaled=rescalePriorToBetaScale(inputs.betaPrior,betaProj);
      betaAlpha=fitBTL(inputs.U,inputs.y,lamP,bpRescaled,muPrior,15);
    }
  }
  var fitMs=Math.round(performance.now()-t0);

  var scoresLeft,scoresRight,leftModel,rightModel;
  var stdOnLeft=(hashStr(participantId)%2)===0;
  if(isChoiceOnly){
    // Compare random projection vs LLM projection (both fit on choices only)
    scoresLeft  = stdOnLeft ? betaRand : betaProj;
    scoresRight = stdOnLeft ? betaProj : betaRand;
    leftModel   = stdOnLeft ? 'random_projection' : 'projection_only';
    rightModel  = stdOnLeft ? 'projection_only'   : 'random_projection';
  }else{
    // Compare LLM projection vs LLM projection + feedback prior
    var fbScores = betaAlpha || betaProj;  // fallback if no feedback received
    scoresLeft  = stdOnLeft ? betaProj  : fbScores;
    scoresRight = stdOnLeft ? fbScores  : betaProj;
    leftModel   = stdOnLeft ? 'projection_only'   : 'projection_alpha';
    rightModel  = stdOnLeft ? 'projection_alpha'  : 'projection_only';
  }

  // Build presentation payload depending on format
  var leftPayload,rightPayload;
  if(format==='top_bottom_bars'){
    var nEach=(comp&&comp.n_per_side)||5;
    nEach=Math.min(nEach,Math.floor(inputs.K/2));
    leftPayload=buildTopBottom(scoresLeft,inputs.dims,nEach);
    rightPayload=buildTopBottom(scoresRight,inputs.dims,nEach);
  }else{
    var nCap=Math.min(nShow,inputs.K);
    leftPayload=buildInferences(scoresLeft,inputs.dims,nCap);
    rightPayload=buildInferences(scoresRight,inputs.dims,nCap);
  }
  evalState={
    eval_format: format,
    fit_duration_ms: fitMs,
    lambda_partial: lamP,
    feedback_alpha: isChoiceOnly?null:muPrior,
    is_baseline_check: isChoiceOnly,
    n_dimensions_shown: format==='top_bottom_bars'?(2*((comp&&comp.n_per_side)||5)):Math.min(nShow,inputs.K),
    has_prior: inputs.hasPrior,
    left_model: leftModel,
    right_model: rightModel,
    left_payload:  leftPayload,
    right_payload: rightPayload,
    rating: null,
    rating_numeric: null,
    response_time_ms: null,
    started_at: Date.now(),
    _betaProj: betaProj,
    _betaAlpha: betaAlpha,
    _betaRand: betaRand,
  };
  // Expose to window for parity verification with test_eval_parity.py.
  // Will be cleared on finishExperiment.
  try{
    window.__lastEvalResult={
      betaProj:betaProj,betaAlpha:betaAlpha,betaRand:betaRand,
      leftModel:leftModel,rightModel:rightModel,
      hasPrior:inputs.hasPrior,isChoiceOnly:isChoiceOnly,
      betaPrior:inputs.betaPrior
    };
  }catch(e){}
  renderEvaluation();
}

var LIKERT_LEVELS=[
  {key:'A_much_better',     label:'is much better',     side:'A', value:-3},
  {key:'A_better',          label:'is better',          side:'A', value:-2},
  {key:'A_slightly_better', label:'is slightly better', side:'A', value:-1},
  {key:'B_slightly_better', label:'is slightly better', side:'B', value: 1},
  {key:'B_better',          label:'is better',          side:'B', value: 2},
  {key:'B_much_better',     label:'is much better',     side:'B', value: 3},
];

function renderInferenceList(infs){
  var h='<ul class="eval-list">';
  infs.forEach(function(inf){
    h+='<li>You <span class="cat-word">'+esc(inf.phrase)+'</span> '+esc(inf.dim_name)+'.</li>';
  });
  h+='</ul>';
  return h;
}

function renderTopBottomBars(tb,labels){
  var maxAbs=0;
  tb.most.concat(tb.least).forEach(function(d){if(Math.abs(d.s)>maxAbs)maxAbs=Math.abs(d.s);});
  if(maxAbs<=0)maxAbs=1e-9;
  function row(d,kind){
    // Diverging bar: each side fills up to 50% of the track from the midpoint outward.
    var pct=Math.max(1.5,Math.round(Math.abs(d.s)/maxAbs*50*10)/10);
    return '<li><span class="dim-name">'+esc(d.name)+'</span><div class="bar-track"><div class="bar-fill '+kind+'" style="width:'+pct+'%"></div></div></li>';
  }
  var h='';
  h+='<div class="eval-section-label">'+esc(labels.most)+'</div><ul class="eval-bars">';
  tb.most.forEach(function(d){h+=row(d,'pos');});
  h+='</ul>';
  h+='<div class="eval-section-label bottom">'+esc(labels.least)+'</div><ul class="eval-bars">';
  tb.least.forEach(function(d){h+=row(d,'neg');});
  h+='</ul>';
  return h;
}

function renderEvaluation(){
  var st=evalState,comp=(experimentConfig&&experimentConfig.comparison)||{};
  var labels={
    most: comp.most_valued_label||'Most valued',
    least: comp.least_valued_label||'Least valued',
  };
  var h='<div class="eval-intro"><h1>Compare these two summaries</h1>';
  h+='<p>Below are two summaries of what we learned about your preferences from your choices.</p>';
  h+='<p>Read both, then tell us which feels more accurate.</p></div>';
  h+='<div class="eval-grid">';
  function colHTML(label,payload){
    if(st.eval_format==='top_bottom_bars')return renderTopBottomBars(payload,labels);
    return renderInferenceList(payload);
  }
  h+='<div class="eval-col"><div class="eval-col-header">Summary A</div>'+colHTML('A',st.left_payload)+'</div>';
  h+='<div class="eval-col"><div class="eval-col-header">Summary B</div>'+colHTML('B',st.right_payload)+'</div>';
  h+='</div>';
  h+='<div class="likert-prompt">Which summary feels more accurate?</div>';
  h+='<div class="likert-row">';
  LIKERT_LEVELS.forEach(function(lv){
    var arrow=lv.side==='A'?'A':'B';
    h+='<button class="likert-btn" data-key="'+lv.key+'" data-value="'+lv.value+'"><span class="arrow">'+arrow+'</span>'+esc(lv.label)+'</button>';
  });
  h+='</div>';
  h+='<div class="submit-row"><button class="btn" id="evalSubmit" disabled>Submit</button></div>';
  app.innerHTML=h;
  window.scrollTo({top:0,behavior:'smooth'});window.__scrollParentToTop&&window.__scrollParentToTop();
  var selected=null;
  app.querySelectorAll('.likert-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      app.querySelectorAll('.likert-btn').forEach(function(b){b.classList.remove('selected');});
      btn.classList.add('selected');
      selected={key:btn.dataset.key,value:parseInt(btn.dataset.value,10)};
      document.getElementById('evalSubmit').disabled=false;
    });
  });
  document.getElementById('evalSubmit').addEventListener('click',function(){
    if(!selected)return;
    evalState.rating=selected.key;
    evalState.rating_numeric=selected.value;
    evalState.response_time_ms=Date.now()-evalState.started_at;
    proceedAfterEval();
  });
}

function proceedAfterEval(){
  if(predictionState){finishExperiment();return;}
  startPrediction();
}

// ===== Prediction-comparison screen (two-trial, single-model-per-trial) =====
//   Picks TWO different held-out pairs (where baseline and augmented disagree
//   when possible). On each screen the user chooses an option, then sees ONE
//   model's prediction + a 6-point Likert. Order of which model is rated
//   first is randomized per participant. This avoids the awkwardness of
//   rating two predictions on the same problem and gives a clean within-
//   subject paired comparison across two distinct pairs.
//
//   Models per condition:
//     choice_only           -> baseline=random_projection, augmented=projection_only
//     inference_affirm/cat. -> baseline=projection_only,   augmented=projection_alpha
//
//   Pair selection priority (top-2 picked by joint criterion):
//     1. unseen + disagreement
//     2. seen   + disagreement
//     3. unseen + (any)
//     4. seen   + (any)
//   Within each tier, sort by max(|baseline_diff|, |augmented_diff|) so
//   both models are confident on the chosen pairs.

function findTwoComparisonPairs(betaB,betaA,projKeyB,projKeyA){
  if(!trialProjections||!Array.isArray(trialProjections))return [];
  if(!Array.isArray(betaB)||!Array.isArray(betaA))return [];
  if(betaB.length===0||betaA.length===0)return [];
  var seen={};assignedTrialIndices.forEach(function(pi){seen[pi]=true;});
  var all=[];
  for(var pi=0;pi<trialProjections.length;pi++){
    var tp=trialProjections[pi];if(!tp)continue;
    var bp=tp[projKeyB],ap=tp[projKeyA];
    if(!Array.isArray(bp)||!Array.isArray(ap))continue;
    if(bp.length!==betaB.length||ap.length!==betaA.length)continue;
    if(!trials[pi]||!trials[pi].option_a||!trials[pi].option_b)continue;
    var bd=0;for(var k=0;k<betaB.length;k++)bd+=betaB[k]*bp[k];
    var ad=0;for(var k2=0;k2<betaA.length;k2++)ad+=betaA[k2]*ap[k2];
    all.push({pi:pi,baselineDiff:bd,augmentedDiff:ad,
              disagree:(bd>=0)!==(ad>=0),unseen:!seen[pi]});
  }
  // Sort: unseen > seen, then disagree > agree, then max(|base|,|aug|) desc.
  all.sort(function(a,b){
    if(a.unseen!==b.unseen)return a.unseen?-1:1;
    if(a.disagree!==b.disagree)return a.disagree?-1:1;
    var ma=Math.max(Math.abs(a.baselineDiff),Math.abs(a.augmentedDiff));
    var mb=Math.max(Math.abs(b.baselineDiff),Math.abs(b.augmentedDiff));
    return mb-ma;
  });
  return all.slice(0,2);
}

function startPrediction(){
  if(!evalState){predictionState={skipped:'no_eval_state'};finishExperiment();return;}
  if(!trialProjections){predictionState={skipped:'missing_trial_projections'};finishExperiment();return;}
  var isChoiceOnly=(evalState.is_baseline_check===true);
  var betaB=null,betaA=null,projKeyB,projKeyA,baselineModel,augmentedModel;
  if(isChoiceOnly){
    betaB=evalState._betaRand;betaA=evalState._betaProj;
    projKeyB='random_projection';projKeyA='raw_projection';
    baselineModel='random_projection';augmentedModel='projection_only';
  }else if(evalState._betaAlpha){
    betaB=evalState._betaProj;betaA=evalState._betaAlpha;
    projKeyB='raw_projection';projKeyA='raw_projection';
    baselineModel='projection_only';augmentedModel='projection_alpha';
  }else{
    // Inference condition with no feedback received -> nothing to compare against.
    predictionState={skipped:'no_augmented_model'};finishExperiment();return;
  }
  if(!Array.isArray(betaB)||!Array.isArray(betaA)||betaB.length===0||betaA.length===0){
    predictionState={skipped:'no_beta'};finishExperiment();return;
  }
  var pairs=findTwoComparisonPairs(betaB,betaA,projKeyB,projKeyA);
  if(pairs.length<2){
    predictionState={skipped:'insufficient_pairs',n_pairs:pairs.length};finishExperiment();return;
  }

  // Randomize role order: which model's prediction is shown FIRST.
  // Hash on participantId so the assignment is deterministic per participant
  // but balanced across the cohort.
  var augFirst=(hashStr(participantId+'_predorder')%2)===0;
  var roles=augFirst?['augmented','baseline']:['baseline','augmented'];

  // Build the two trial entries. Each is associated with one model role.
  var ptrials=[];
  for(var i=0;i<2;i++){
    var pair=pairs[i];
    var role=roles[i];
    var modelName=role==='augmented'?augmentedModel:baselineModel;
    var basePred=pair.baselineDiff>=0?'a':'b';
    var augPred =pair.augmentedDiff>=0?'a':'b';
    var modelPred=role==='augmented'?augPred:basePred;
    ptrials.push({
      role:role,
      model:modelName,
      pair_index:pair.pi,
      trial_id:trials[pair.pi].trial_id||null,
      baseline_diff:Math.round(pair.baselineDiff*1e4)/1e4,
      augmented_diff:Math.round(pair.augmentedDiff*1e4)/1e4,
      disagreement:pair.disagree,
      baseline_predicts:basePred,
      augmented_predicts:augPred,
      model_predicts:modelPred,
      rating:null,
      rating_numeric:null,
      rating_label:null,
      response_time_ms:null,
      started_at:null,
    });
  }

  predictionState={
    baseline_model:baselineModel,
    augmented_model:augmentedModel,
    role_order:roles,
    n_trials:2,
    current_index:0,
    started_at:Date.now(),
    trials:ptrials,
  };
  renderPredictionTrial();
}

var ACCURACY_LEVELS=[
  {key:'not_at_all',     label:'Not at all accurate',  value:1},
  {key:'mostly_inacc',   label:'Mostly inaccurate',    value:2},
  {key:'slightly_inacc', label:'Slightly inaccurate',  value:3},
  {key:'slightly_acc',   label:'Slightly accurate',    value:4},
  {key:'mostly_acc',     label:'Mostly accurate',      value:5},
  {key:'very_acc',       label:'Very accurate',        value:6},
];

function renderPredictionTrial(){
  var st=predictionState;
  var idx=st.current_index;
  var pt=st.trials[idx];
  if(!pt.started_at)pt.started_at=Date.now();
  var trial=trials[pt.pair_index];
  var stepLabel='Final question '+(idx+1)+' of '+st.n_trials;
  var h='<div class="eval-intro"><h1>'+esc(stepLabel)+'</h1>';
  if(idx===0){
    h+='<p>For these final pairs, we\u2019ve predicted which option you would choose. The option highlighted in blue is <strong>our prediction</strong>. Rate how accurate it is.</p>';
  }else{
    h+='<p>One more. The option highlighted in blue is <strong>our prediction</strong>. Rate how accurate it is.</p>';
  }
  h+='</div>';
  if(trial.situation)h+='<div class="situation">'+esc(trial.situation)+'</div>';

  function predictionCard(key,opt,isPrediction){
    var card=buildCard(key,opt);
    var cls=isPrediction?'option-card pred-selected':'option-card pred-other';
    card=card.replace('class="option-card"','class="'+cls+'"');
    if(isPrediction)card='<div class="pred-badge">Our prediction</div>'+card;
    else card='<div class="pred-badge pred-badge-empty">&nbsp;</div>'+card;
    return '<div class="pred-card-wrap">'+card+'</div>';
  }
  var aIsPred=(pt.model_predicts==='a');
  h+='<div class="options pred-options">'+predictionCard('a',trial.option_a,aIsPred)+predictionCard('b',trial.option_b,!aIsPred)+'</div>';

  h+='<div class="likert-prompt">How accurate is our prediction?</div>';
  h+='<div class="likert-row accuracy-row">';
  ACCURACY_LEVELS.forEach(function(lv){
    h+='<button class="likert-btn" data-key="'+lv.key+'" data-value="'+lv.value+'">'+esc(lv.label)+'</button>';
  });
  h+='</div>';
  h+='<div class="submit-row"><button class="btn" id="predSubmit" disabled>'+(idx<st.n_trials-1?'Continue':'Submit')+'</button></div>';
  app.innerHTML=h;
  window.scrollTo({top:0,behavior:'smooth'});window.__scrollParentToTop&&window.__scrollParentToTop();

  app.querySelectorAll('.likert-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      app.querySelectorAll('.likert-btn').forEach(function(b){b.classList.remove('selected');});
      btn.classList.add('selected');
      pt._rating_key=btn.dataset.key;
      pt._rating_value=parseInt(btn.dataset.value,10);
      pt._rating_label=btn.textContent.trim();
      document.getElementById('predSubmit').disabled=false;
    });
  });
  document.getElementById('predSubmit').addEventListener('click',submitPredictionTrial);
}

function submitPredictionTrial(){
  var st=predictionState;
  var pt=st.trials[st.current_index];
  if(!pt._rating_key)return;
  pt.rating=pt._rating_key;
  pt.rating_numeric=pt._rating_value;
  pt.rating_label=pt._rating_label;
  pt.response_time_ms=Date.now()-pt.started_at;
  delete pt._rating_key;delete pt._rating_value;delete pt._rating_label;
  st.current_index++;
  if(st.current_index<st.n_trials){
    renderPredictionTrial();
  }else{
    finishExperiment();
  }
}

function esc(s){if(s==null)return'';var d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
function hashStr(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0}return Math.abs(h)}
function seedRandom(seed){var s=seed|0;return function(){s=(s+0x6D2B79F5)|0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function shuffle(arr,rng){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a}
})();
</script>
